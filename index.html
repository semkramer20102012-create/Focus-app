<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Study Pro</title>
    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --primary: #bb86fc;
            --secondary: #03dac6;
            --error: #cf6679;
            --text: #ffffff;
            --text-dim: #b0b0b0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background-format 0.5s ease;
            overflow-x: hidden;
        }

        .container {
            width: 90%;
            max-width: 400px;
            margin: 20px auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 { color: var(--primary); font-size: 1.8rem; margin-bottom: 10px; }
        p { color: var(--text-dim); font-size: 0.9rem; }

        textarea {
            width: 100%;
            height: 150px;
            background: #2c2c2c;
            color: var(--text);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px;
            margin-top: 10px;
            font-family: inherit;
            resize: none;
            box-sizing: border-box;
        }

        #timer-display {
            font-size: 4.5rem;
            font-weight: 800;
            margin: 15px 0;
            font-variant-numeric: tabular-nums;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:active { transform: scale(0.96); }

        .btn-primary { background: var(--secondary); color: #000; }
        .btn-secondary { background: var(--primary); color: #000; }
        .btn-danger { background: var(--error); color: #fff; }
        .btn-outline { background: transparent; border: 1px solid #444; color: var(--text); }

        #quiz-container, #flashcard-container { display: none; text-align: left; }
        .quiz-option {
            display: block;
            background: #2c2c2c;
            padding: 14px;
            margin: 10px 0;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .quiz-option:hover { background: #3d3:3d; }
        .quiz-option.correct { background: var(--secondary); color: #000; }
        .quiz-option.wrong { background: var(--error); color: #fff; }

        .hidden { display: none !important; }
        body.focus-mode { background-color: #000; }
    </style>
</head>
<body>
    <!-- Content kept same as previous version to trigger GitHub build -->
    <div id="input-section" class="container">
        <h1>Focus Pro</h1>
        <p>Paste notes below:</p>
        <textarea id="study-notes" placeholder="Paste text here..."></textarea>
        <div class="btn-group">
            <button class="btn-primary" onclick="startFocus()">Start Focus</button>
        </div>
    </div>
    <div id="timer-section" class="container hidden">
        <div id="timer-display">25:00</div>
        <button class="btn-danger" onclick="window.location.reload()">Reset</button>
    </div>
    <script>
        function startFocus() {
            document.getElementById('input-section').classList.add('hidden');
            document.getElementById('timer-section').classList.remove('hidden');
            document.body.classList.add('focus-mode');
            alert("Focus Mode Active! 📵");
        }
    </script>
</body>
</html>
